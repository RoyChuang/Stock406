name: Update data & deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 平日每 15 分鐘（涵蓋台股與美股交易時段），週末每 6 小時
    - cron: '*/15 * * * 1-5'
    - cron: '0 */6 * * 0,6'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs
      - name: Assemble site
        run: mkdir _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
