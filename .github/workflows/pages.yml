name: Update data & deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 平日每 15 分鐘（涵蓋台股與美股交易時段），週末每 6 小時
    - cron: '*/15 * * * 1-5'
    - cron: '0 */6 * * 0,6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 融資融券歷史存在 data 分支，先還原再只補抓缺的日期（證交所每天晚上約 21:00 後公布）
      - name: Margin trading history
        continue-on-error: true
        run: |
          mkdir -p data
          git fetch -q --depth=1 origin data && git show FETCH_HEAD:margin.json > data/margin.json || rm -f data/margin.json
          node scripts/margin.mjs
      # 外資台指期未平倉（期交所每天約 15:00 後公布），一個請求抓近一年
      - run: node scripts/futures.mjs
        continue-on-error: true
      - run: node scripts/fetch-data.mjs
      # 回測「到支撐＋止跌跡象」，失敗不影響部署（儀表板會顯示讀不到）
      - run: node scripts/backtest.mjs
        continue-on-error: true
      # 雲端排程連不到 Yahoo / github.io，只能讀 repo，所以把最新資料強制推到單一 commit 的 data 分支
      - name: Publish data branch
        run: |
          cd data
          git init -q -b data
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: Assemble site
        run: mkdir _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
